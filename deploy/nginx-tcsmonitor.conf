# HTTP configuration for a plain Ubuntu 24.04 VPS.
# Change both hostnames if the final domain differs.
# Enable HTTPS with Certbot after DNS points to the VPS.
server {
    listen 80;
    listen [::]:80;
    server_name tcsmonitor.online www.tcsmonitor.online 187.77.127.18;

    root /var/www/tcsmonitor;
    index index.html;
    autoindex off;

    access_log /var/log/nginx/tcsmonitor.access.log;
    error_log /var/log/nginx/tcsmonitor.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    # Explicit JavaScript MIME type is necessary for ES module imports.
    # Only the four application modules are exposed.
    location ~ ^/(app|dashboard|supabase/(config|store))\.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
    }

    # Source tests, SQL files, package files and other paths are not served.
    location / {
        return 404;
    }
}
